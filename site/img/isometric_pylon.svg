<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" fill="none">
  <!-- Shadow -->
  <ellipse cx="90" cy="210" rx="45" ry="8" fill="#d8dce4" opacity="0.5"/>

  <!-- Base platform (isometric square) -->
  <path d="M50 195 L90 210 L130 195 L90 180Z" fill="#8a94a8" stroke="#6b7588" stroke-width="1"/>
  <path d="M50 195 L90 210 L90 215 L50 200Z" fill="#6b7588"/>
  <path d="M130 195 L90 210 L90 215 L130 200Z" fill="#555f70"/>

  <!-- Main pylon body (lattice tower) -->
  <!-- Left leg -->
  <line x1="68" y1="190" x2="80" y2="50" stroke="#6b7a8d" stroke-width="2.5"/>
  <!-- Right leg -->
  <line x1="112" y1="190" x2="100" y2="50" stroke="#6b7a8d" stroke-width="2.5"/>

  <!-- Cross braces -->
  <line x1="72" y1="175" x2="108" y2="175" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="74" y1="160" x2="106" y2="160" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="76" y1="145" x2="104" y2="145" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="78" y1="130" x2="102" y2="130" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="79" y1="115" x2="101" y2="115" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="80" y1="100" x2="100" y2="100" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="81" y1="85" x2="99" y2="85" stroke="#6b7a8d" stroke-width="1.2"/>
  <line x1="82" y1="70" x2="98" y2="70" stroke="#6b7a8d" stroke-width="1.2"/>

  <!-- Diagonal cross braces -->
  <line x1="72" y1="175" x2="106" y2="160" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="108" y1="175" x2="74" y2="160" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="74" y1="160" x2="104" y2="145" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="106" y1="160" x2="76" y2="145" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="76" y1="145" x2="102" y2="130" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="104" y1="145" x2="78" y2="130" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="78" y1="130" x2="101" y2="115" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="102" y1="130" x2="79" y2="115" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="79" y1="115" x2="100" y2="100" stroke="#8a94a8" stroke-width="0.8"/>
  <line x1="101" y1="115" x2="80" y2="100" stroke="#8a94a8" stroke-width="0.8"/>

  <!-- Top section (narrower) -->
  <line x1="85" y1="50" x2="90" y2="15" stroke="#6b7a8d" stroke-width="2"/>
  <line x1="95" y1="50" x2="90" y2="15" stroke="#6b7a8d" stroke-width="2"/>

  <!-- Cross arms (transmission lines) -->
  <!-- Left arm -->
  <line x1="30" y1="52" x2="150" y2="52" stroke="#555f70" stroke-width="2.5"/>
  <line x1="40" y1="65" x2="140" y2="65" stroke="#555f70" stroke-width="2"/>

  <!-- Insulators (small circles hanging from cross arms) -->
  <!-- Top arm insulators -->
  <line x1="40" y1="52" x2="38" y2="62" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="38" cy="64" r="2" fill="#a0aab8"/>
  <line x1="60" y1="52" x2="58" y2="62" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="58" cy="64" r="2" fill="#a0aab8"/>

  <line x1="120" y1="52" x2="122" y2="62" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="122" cy="64" r="2" fill="#a0aab8"/>
  <line x1="140" y1="52" x2="142" y2="62" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="142" cy="64" r="2" fill="#a0aab8"/>

  <!-- Bottom arm insulators -->
  <line x1="50" y1="65" x2="48" y2="75" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="48" cy="77" r="2" fill="#a0aab8"/>
  <line x1="130" y1="65" x2="132" y2="75" stroke="#8a94a8" stroke-width="1"/>
  <circle cx="132" cy="77" r="2" fill="#a0aab8"/>

  <!-- Wires hanging from insulators -->
  <path d="M38 66 Q28 80 18 66" fill="none" stroke="#555f70" stroke-width="0.8"/>
  <path d="M58 66 Q48 80 38 66" fill="none" stroke="#555f70" stroke-width="0.8"/>
  <path d="M122 66 Q132 80 142 66" fill="none" stroke="#555f70" stroke-width="0.8"/>

  <path d="M48 79 Q38 90 28 79" fill="none" stroke="#555f70" stroke-width="0.8"/>
  <path d="M132 79 Q142 90 152 79" fill="none" stroke="#555f70" stroke-width="0.8"/>
</svg>
