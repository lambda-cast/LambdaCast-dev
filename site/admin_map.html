<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LambdaCast — Admin Carte du parc</title>
  <link href="/lib/bootstrap.min.css" rel="stylesheet"/>
  <link href="/lib/fontawesome/css/all.min.css" rel="stylesheet"/>
  <link href="/lib/leaflet.min.css" rel="stylesheet"/>
  <link href="/css/platform.css" rel="stylesheet"/>
  <style>
    #map { height: calc(100vh - 300px); min-height: 400px; border-radius: 12px; }
    .filter-bar {
      background: #fff; border-radius: 10px; padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
  </style>
</head>
<body class="platform-page">

<div class="spinner-overlay" role="status"><div class="sz-spinner"></div></div>
</div>

<header class="sz-header" id="sz-header"></header>

<nav class="sz-sidebar" aria-label="Main navigation"><ul class="sz-nav" id="sz-sidebar-nav"></ul><div class="sz-sidebar-footer"><ul class="sz-nav" style="padding:0"><li class="sz-nav-item"><button class="sz-nav-link" id="sz-logout-footer-btn" style="width:100%;text-align:left;border:none;background:none;cursor:pointer"><i class="sz-nav-icon fas fa-right-from-bracket"></i>Déconnexion</button></li></ul></div></nav>

  <main class="sz-main">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-0">Carte du parc — Tunisia</h4>
        <p class="text-muted small mb-0" id="map-subtitle">Loading…</p>
      </div>
      <a href="/admin/installations" class="sz-btn sz-btn-secondary sz-btn-sm">
        <i class="fas fa-list me-1"></i>Table View
      </a>
    </div>

    <!-- Fleet stats bar -->
    <div class="row g-2 mb-3 d-none" id="stats-bar">
      <div class="col-auto"><span class="badge bg-light text-dark border" id="stat-total">0 total</span></div>
      <div class="col-auto"><span class="badge bg-success"              id="stat-active">0 active</span></div>
      <div class="col-auto"><span class="badge bg-warning text-dark"    id="stat-maintenance">0 maintenance</span></div>
      <div class="col-auto"><span class="badge bg-secondary"            id="stat-inactive">0 inactive</span></div>
      <div class="col-auto"><span class="badge bg-light text-dark border" id="stat-capacity">0 kWp</span></div>
    </div>

    <div id="alert-error" style="display:none" id="alert-error" mb-3></div>

    <!-- Filters -->
    <div class="filter-bar d-flex gap-3 flex-wrap align-items-end mb-3">
      <div>
        <label class="sz-label small fw-semibold mb-1">Governorate</label>
        <select id="filter-gov" class="sz-select form-select-sm" style="min-width:140px">
          <option value="">Tous Governorates</option>
        </select>
      </div>
      <div>
        <label class="sz-label small fw-semibold mb-1">Status</label>
        <select id="filter-status" class="sz-select form-select-sm">
          <option value="">Tous Statuses</option>
          <option value="active">Actives</option>
          <option value="maintenance">En maintenance</option>
          <option value="inactive">Inactives</option>
        </select>
      </div>
      <div>
        <label class="sz-label small fw-semibold mb-1">Organization</label>
        <select id="filter-org" class="sz-select form-select-sm" style="min-width:140px">
          <option value="">Tous Organizations</option>
        </select>
      </div>
      <button class="sz-btn sz-btn-primary btn-sm" id="btn-apply-filters">
        <i class="fas fa-filter me-1"></i>Apply
      </button>
      <button class="sz-btn sz-btn-secondary btn-sm" id="btn-reset-filters">Reset</button>
    </div>

    <!-- Legend -->
    <div class="d-flex gap-3 mb-2 flex-wrap small">
      <span><i class="fas fa-location-dot" style="color:#27ae60;margin-right:4px"></i>Actives</span>
      <span><i class="fas fa-location-dot" style="color:#f39c12;margin-right:4px"></i>En maintenance</span>
      <span><i class="fas fa-location-dot" style="color:#95a5a6;margin-right:4px"></i>Inactives</span>
    </div>

    <div id="map"></div>

  </main>

<script src="/lib/bootstrap.bundle.min.js"></script>
<script src="/lib/leaflet.min.js"></script>
<script src="/js/platform_api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/map_utils.js"></script>
<script>
let gMap    = null;
let gLayer  = null;
let gGeojson = null;

(async () => {
  PlatformAPI.showSpinner();
  try {
    const user = await PlatformAPI.requireAdmin();
    if (!user) return;
    initShell(user, '/admin/map');
    // Wire sidebar logout
    document.querySelectorAll('.sz-nav-link[id=sz-logout-footer-btn]').forEach(el => el.addEventListener('click', () => PlatformAPI.auth.logout()));

    gMap = MapUtils.createTunisiaMap('map');

    // Load map data, statistics and organizations in parallel
    const [geojson, stats, orgs] = await Promise.all([
      PlatformAPI.admin.adminMap(),
      PlatformAPI.admin.solarStatistics(),
      PlatformAPI.admin.listOrganizations(),
    ]);

    gGeojson = geojson;

    renderStats(stats);
    populateFilters(geojson, orgs);
    renderLayer(geojson);

    // Filter controls
    document.getElementById('btn-apply-filters').addEventListener('click', applyFilters);
    document.getElementById('btn-reset-filters').addEventListener('click', () => {
      document.getElementById('filter-gov').value    = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-org').value    = '';
      applyFilters();
    });

    } catch (err) {
    PlatformAPI.showError('Failed to load fleet map: ' + (err.data?.error || err.message));
  } finally {
    PlatformAPI.hideSpinner();
  }
})();

function renderStats(stats) {
  const bar = document.getElementById('stats-bar');
  bar.classList.remove('d-none');

  document.getElementById('stat-total').textContent =
    `${stats.total_installations} installation${stats.total_installations !== 1 ? 's' : ''}`;
  document.getElementById('stat-active').textContent      = `${stats.active_count} active`;
  document.getElementById('stat-maintenance').textContent = `${stats.maintenance_count} maintenance`;
  document.getElementById('stat-inactive').textContent    = `${stats.inactive_count} inactive`;
  document.getElementById('stat-capacity').textContent    =
    `${(stats.total_capacity_kwp || 0).toFixed(1)} kWp total`;

  const mapped = gGeojson ? gGeojson.features.length : 0;
  document.getElementById('map-subtitle').textContent =
    `${stats.total_installations} installations · ${mapped} with coordinates · ` +
    `${(stats.total_capacity_kwp || 0).toFixed(1)} kWp total`;
}

function populateFilters(geojson, orgs) {
  const govs = new Set(
    geojson.features.map(f => f.properties.governorate).filter(Boolean)
  );
  const govSel = document.getElementById('filter-gov');
  [...govs].sort().forEach(g => {
    const o = document.createElement('option');
    o.value = g; o.textContent = g;
    govSel.appendChild(o);
  });

  const orgSel = document.getElementById('filter-org');
  orgs.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id; opt.textContent = o.name;
    orgSel.appendChild(opt);
  });
}

function renderLayer(geojson) {
  if (gLayer) { gMap.removeLayer(gLayer); gLayer = null; }

  if (!geojson.features.length) {
    const sub = document.getElementById('map-subtitle');
    if (!sub.textContent.includes('No coordinates')) {
      sub.textContent += ' · No coordinates to display';
    }
    return;
  }
  gLayer = MapUtils.addInstallationsLayer(gMap, geojson);
  MapUtils.fitToBounds(gMap, gLayer);
}

async function applyFilters() {
  const gov    = document.getElementById('filter-gov').value;
  const status = document.getElementById('filter-status').value;
  const orgId  = document.getElementById('filter-org').value;
  try {
    const geojson = await PlatformAPI.admin.adminMap(
      { governorate: gov, status, org_id: orgId }
    );
    renderLayer(geojson);
  } catch (err) {
    PlatformAPI.showError('Filter failed: ' + (err.data?.error || err.message));
  }
}
</script>
</body>
</html>
