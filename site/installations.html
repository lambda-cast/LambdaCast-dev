<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sunalyzer — Mes installations</title>
  <link href="/lib/bootstrap.min.css" rel="stylesheet"/>
  <link href="/lib/fontawesome/css/all.min.css" rel="stylesheet"/>
  <link href="/css/platform.css" rel="stylesheet"/>
</head>
<body class="platform-page">

<div class="spinner-overlay" role="status"><div class="sz-spinner"></div></div>
</div>

<header class="sz-header" id="sz-header"></header>

<nav class="sz-sidebar" aria-label="Main navigation"><ul class="sz-nav" id="sz-sidebar-nav"></ul><div class="sz-sidebar-footer"><ul class="sz-nav" style="padding:0"><li class="sz-nav-item"><button class="sz-nav-link" id="sz-logout-footer-btn" style="width:100%;text-align:left;border:none;background:none;cursor:pointer"><i class="sz-nav-icon fas fa-right-from-bracket"></i>Déconnexion</button></li></ul></div></nav>

  <main class="sz-main">

    <!-- Detail panel -->
    <div id="detail-panel" class="sz-card mb-4 d-none">
      <div class="sz-card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold" id="detail-name">Details</span>
        <div class="d-flex gap-2">
          <a id="detail-edit-btn"    href="#" class="sz-btn sz-btn-secondary sz-btn-sm">
            <i class="fas fa-pen me-1"></i>Edit</a>
          <a id="detail-monitor-btn" href="#" class="sz-btn sz-btn-primary sz-btn-sm">
            <i class="fas fa-chart-line me-1"></i>Monitor</a>
          <button class="sz-btn sz-btn-secondary sz-btn-sm" id="close-detail">
            <i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="sz-card-body" id="detail-body"></div>
    </div>

    <!-- List panel -->
    <div id="list-panel">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="fw-bold mb-0">Mes installations</h4>
          <p class="text-muted small mb-0">Manage your solar PV sites</p>
        </div>
        <a href="/platform/installations/new" class="sz-btn sz-btn-primary">
          <i class="fas fa-plus me-1"></i>Add Installation
        </a>
      </div>

      <div id="alert-error"   class="alert alert-danger  d-none mb-3"></div>
      <div id="alert-success" style="display:none" id="alert-success" mb-3></div>

      <div id="empty-state" class="text-center py-5 d-none">
        <i class="fas fa-solar-panel fa-4x mb-3 text-warning opacity-50"></i>
        <h5>Aucune installation</h5>
        <p class="text-muted">Add your first solar installation to get started.</p>
        <a href="/platform/installations/new" class="sz-btn sz-btn-primary">
          <i class="fas fa-plus me-1"></i>Add Installation
        </a>
      </div>

      <div class="row g-3" id="installations-grid"></div>
    </div>

  </main>

<!-- Delete modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-modal="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Supprimer l'installation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Êtes-vous sûr de vouloir supprimer <strong id="delete-name"></strong>?
        This cannot be undone.
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button class="sz-btn sz-btn-danger btn-sm" id="confirm-delete">Supprimer</button>
      </div>
    </div>
  </div>
</div>

<script src="/lib/bootstrap.bundle.min.js"></script>
<script src="/js/platform_api.js"></script>
<script src="/js/shell.js"></script>
<script>
let gInstallations = [];
let gDeleteId = null;
const deleteModal = new bootstrap.Modal(document.getElementById("deleteModal"));

(async () => {
  PlatformAPI.showSpinner();
  try {
    const user = await PlatformAPI.requireAuth();
    if (!user) return;
    initShell(user, '/platform/installations');
    // Wire sidebar logout
    document.querySelectorAll('.sz-nav-link[id=sz-logout-footer-btn]').forEach(el => el.addEventListener('click', () => PlatformAPI.auth.logout()));

    // Admin should use /admin/installations, not this page
    if (user.role === "ADMIN") {
      window.location.replace("/admin/installations");
      return;
    }

    // Load installations
    try {
      gInstallations = await PlatformAPI.installations.list();
      renderGrid(gInstallations);
    } catch (err) {
      PlatformAPI.showError("Failed to load installations: " +
        (err.data?.error || err.message || "Unknown error"));
    }

    // Deep-link to a specific installation
    if (location.hash) {
      const id = parseInt(location.hash.slice(1));
      if (!isNaN(id)) showDetail(id);
    }

    // Event listeners — only registered after auth succeeds
    document.getElementById("close-detail").addEventListener("click", () => {
      document.getElementById("detail-panel").classList.add("d-none");
      document.getElementById("list-panel").style.display = "";
      history.replaceState(null, "", location.pathname);
    });

    document.getElementById("confirm-delete").addEventListener("click", async () => {
      if (!gDeleteId) return;
      deleteModal.hide();
      PlatformAPI.showSpinner();
      try {
        await PlatformAPI.installations.delete(gDeleteId);
        gDeleteId = null;
        document.getElementById("alert-success").textContent = "Installation supprimée.";
        document.getElementById("alert-success").classList.remove("d-none");
        gInstallations = await PlatformAPI.installations.list();
        renderGrid(gInstallations);
      } catch (err) {
        PlatformAPI.showError(err.data?.error || "Échec de la suppression.");
      } finally {
        PlatformAPI.hideSpinner();
      }
    });

  } catch (err) {
    PlatformAPI.showError("Page error: " + (err.message || "Unknown error"));
  } finally {
    PlatformAPI.hideSpinner();
  }
})();

function renderGrid(list) {
  const grid  = document.getElementById("installations-grid");
  const empty = document.getElementById("empty-state");
  if (!list.length) {
    grid.innerHTML = "";
    empty.classList.remove("d-none");
    return;
  }
  empty.classList.add("d-none");
  grid.innerHTML = list.map(i => `
    <div class="col-md-6 col-xl-4">
      <div class="card installation-card h-100" role="button"
           onclick="showDetail(${i.id})" aria-label="View ${esc(i.name)}">
        <div class="sz-card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h6 class="fw-bold mb-0">${esc(i.name)}</h6>
            <span class="capacity-badge">
              ${i.installed_capacity_kwp != null ? i.installed_capacity_kwp + " kWp" : "—"}
            </span>
          </div>
          <p class="text-muted small mb-2">
            <i class="fas fa-map-marker-alt me-1"></i>
            ${esc(i.city || i.governorate || "Localisation non définie")}
            ${i.latitude != null && i.longitude != null ? `<br><i class="fas fa-globe me-1 opacity-50"></i>${(+i.latitude).toFixed(4)}, ${(+i.longitude).toFixed(4)}` : ""}
          </p>
          <div class="d-flex gap-2 flex-wrap small text-muted">
            ${i.panel_manufacturer ? `<span><i class="fas fa-layer-group me-1"></i>${esc(i.panel_manufacturer)}</span>` : ""}
            ${i.inverter_manufacturer ? `<span><i class="fas fa-plug me-1"></i>${esc(i.inverter_manufacturer)}</span>` : ""}
          </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
          <span>
            <span class="status-dot ${i.status || "active"}"></span>
            <span class="text-muted small">${i.status || "active"}</span>
          </span>
          <div class="d-flex gap-1" onclick="event.stopPropagation()">
            <a href="/platform/installations/${i.id}/monitor"
               class="sz-btn sz-btn-primary sz-btn-sm" title="Monitoring en direct">
              <i class="fas fa-chart-line"></i></a>
            <a href="/platform/installations/${i.id}/edit"
               class="sz-btn sz-btn-secondary sz-btn-sm" title="Modifier">
              <i class="fas fa-pen"></i></a>
            <button class="sz-btn sz-btn-danger sz-btn-sm"
                    onclick="confirmDelete(${i.id},'${esc(i.name)}')" title="Supprimer">
              <i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    </div>`).join("");
}

async function showDetail(id) {
  const inst = gInstallations.find(i => i.id === id)
    || await PlatformAPI.installations.get(id).catch(() => null);
  if (!inst) return;
  history.replaceState(null, "", `#${id}`);
  document.getElementById("detail-name").textContent = inst.name;
  document.getElementById("detail-edit-btn").href    = `/platform/installations/${id}/edit`;
  document.getElementById("detail-monitor-btn").href = `/platform/installations/${id}/monitor`;
  document.getElementById("detail-body").innerHTML   = renderDetailHTML(inst);
  document.getElementById("list-panel").style.display = "none";
  document.getElementById("detail-panel").classList.remove("d-none");
  document.getElementById("detail-panel").scrollIntoView({ behavior: "smooth" });
}

function renderDetailHTML(i) {
  const row = (label, value) => value != null && value !== ""
    ? `<tr><th class="text-muted fw-normal small" style="width:42%">${label}</th><td class="small">${esc(String(value))}</td></tr>` : "";
  return `
    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-section-header">System</div>
        <table class="table table-sm table-borderless mb-2">
          ${row("Capacity", i.installed_capacity_kwp != null ? i.installed_capacity_kwp + " kWp" : null)}
          ${row("Status", i.status)} ${row("Installed", i.installation_date)}
        </table>
        <div class="form-section-header">Panels</div>
        <table class="table table-sm table-borderless mb-2">
          ${row("Manufacturer", i.panel_manufacturer)} ${row("Model", i.panel_model)}
          ${row("Technology", i.panel_technology)}
          ${row("Power/panel", i.panel_power_wp != null ? i.panel_power_wp + " Wp" : null)}
          ${row("Count", i.number_of_panels)}
          ${row("Tilt", i.tilt != null ? i.tilt + "°" : null)}
          ${row("Azimuth", i.azimuth != null ? i.azimuth + "°" : null)}
        </table>
      </div>
      <div class="col-md-6">
        <div class="form-section-header">Location</div>
        <table class="table table-sm table-borderless mb-2">
          ${row("Address", i.address)} ${row("City", i.city)}
          ${row("Governorate", i.governorate)} ${row("Delegation", i.delegation)}
          ${row("Lat / Lon", i.latitude != null ? i.latitude + " / " + i.longitude : null)}
        </table>
        <div class="form-section-header">Inverter</div>
        <table class="table table-sm table-borderless mb-0">
          ${row("Manufacturer", i.inverter_manufacturer)} ${row("Model", i.inverter_model)}
          ${row("Capacity", i.inverter_capacity_kw != null ? i.inverter_capacity_kw + " kW" : null)}
        </table>
      </div>
      ${i.notes ? `<div class="col-12"><div class="form-section-header">Notes</div><p class="text-muted small">${esc(i.notes)}</p></div>` : ""}
    </div>`;
}

function confirmDelete(id, name) {
  gDeleteId = id;
  document.getElementById("delete-name").textContent = name;
  deleteModal.show();
}

function esc(s) {
  return s == null ? "" : String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>
