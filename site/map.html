<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sunalyzer — My Installations Map</title>
  <link href="/lib/bootstrap.min.css" rel="stylesheet"/>
  <link href="/lib/fontawesome/css/all.min.css" rel="stylesheet"/>
  <link href="/lib/leaflet.min.css" rel="stylesheet"/>
  <link href="/css/platform.css" rel="stylesheet"/>
  <style>
    #map { height: calc(100vh - 220px); min-height: 400px; border-radius: 12px; }
  </style>
</head>
<body class="platform-page">

<div class="spinner-overlay" role="status" aria-label="Loading">
  <div class="spinner-border text-warning" style="width:3rem;height:3rem;"></div>
</div>

<nav class="navbar navbar-expand-lg platform-navbar px-3">
  <a class="navbar-brand" href="/platform"><i class="fas fa-sun me-2"></i>Sunalyzer</a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="text-warning small fw-semibold" id="nav-username"></span>
    <span class="badge d-none" id="nav-role-badge"></span>
    <button class="btn btn-sm btn-outline-light" id="logout-btn">
      <i class="fas fa-sign-out-alt me-1"></i>Logout
    </button>
  </div>
</nav>

<div class="container-fluid">
<div class="row">

  <nav class="col-md-3 col-lg-2 d-md-block platform-sidebar">
    <ul class="nav flex-column pt-2" id="sidebar-nav"></ul>
  </nav>

  <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-0">My Installations — Map</h4>
        <p class="text-muted small mb-0" id="map-subtitle">Loading…</p>
      </div>
      <a href="/platform/installations" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-list me-1"></i>List View
      </a>
    </div>

    <div id="alert-error" class="alert alert-danger d-none mb-3"></div>

    <div class="d-flex gap-3 mb-2 flex-wrap small">
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#27ae60;margin-right:4px"></span>Active</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#f39c12;margin-right:4px"></span>Maintenance</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#95a5a6;margin-right:4px"></span>Inactive</span>
    </div>

    <div id="map"></div>

    <div id="no-coords-warning" class="alert alert-info mt-3 d-none">
      <i class="fas fa-info-circle me-2"></i>
      <span id="no-coords-text"></span>
      <a href="/platform/installations" class="alert-link ms-1">Set coordinates →</a>
    </div>

  </main>
</div>
</div>

<script src="/lib/bootstrap.bundle.min.js"></script>
<script src="/lib/leaflet.min.js"></script>
<script src="/js/platform_api.js"></script>
<script src="/js/map_utils.js"></script>
<script>
(async () => {
  PlatformAPI.showSpinner();
  try {
    const user = await PlatformAPI.requireAuth();
    if (!user) return;

    document.getElementById('nav-username').textContent = user.username;
    if (user.role === 'ADMIN') {
      const b = document.getElementById('nav-role-badge');
      b.textContent = 'ADMIN'; b.className = 'badge bg-warning text-dark';
    }
    document.getElementById('sidebar-nav').innerHTML =
      PlatformAPI.buildSidebarNav('/platform/map', user);

    const map = MapUtils.createTunisiaMap('map');

    const [geojson, allInsts] = await Promise.all([
      PlatformAPI.installations.map(),
      PlatformAPI.installations.list(),
    ]);

    const total   = allInsts.length;
    const mapped  = geojson.features.length;
    const noCoord = total - mapped;

    document.getElementById('map-subtitle').textContent =
      mapped > 0
        ? `${mapped} installation${mapped !== 1 ? 's' : ''} shown` +
          (noCoord > 0 ? ` · ${noCoord} without coordinates` : '')
        : 'No installations with coordinates yet';

    if (noCoord > 0) {
      const w = document.getElementById('no-coords-warning');
      document.getElementById('no-coords-text').textContent =
        `${noCoord} installation${noCoord > 1 ? 's' : ''} ` +
        `${noCoord > 1 ? 'have' : 'has'} no coordinates and cannot be shown.`;
      w.classList.remove('d-none');
    }

    // Attach live production data to popups
    let liveData = {};
    try {
      const stats = await fetch('/query?type=current').then(r => r.json());
      if (stats.state === 'ok') {
        allInsts.forEach(i => { liveData[i.id] = stats.currently_produced_w; });
      }
    } catch (_) {}

    if (geojson.features.length > 0) {
      const layer = MapUtils.addInstallationsLayer(map, geojson, liveData);
      MapUtils.fitToBounds(map, layer);
    }

    document.getElementById('logout-btn').addEventListener('click', () =>
      PlatformAPI.auth.logout());

  } catch (err) {
    PlatformAPI.showError('Failed to load map data: ' + (err.data?.error || err.message));
  } finally {
    PlatformAPI.hideSpinner();
  }
})();
</script>
</body>
</html>
