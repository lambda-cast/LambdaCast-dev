<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunalyzer — Login</title>
  <link href="/lib/bootstrap.min.css" rel="stylesheet" />
  <link href="/lib/fontawesome/css/all.min.css" rel="stylesheet" />
  <link href="/css/platform.css" rel="stylesheet" />
</head>
<body class="platform-page">

<div class="auth-wrapper p-3">
  <div class="auth-card card p-4 p-md-5 mx-auto">

    <!-- Logo -->
    <div class="text-center mb-4">
      <div class="auth-logo mb-2">
        <i class="fas fa-sun"></i>
      </div>
      <h4 class="fw-bold text-dark">Sunalyzer Platform</h4>
      <p class="text-muted small">Sign in to manage your solar installations</p>
    </div>

    <!-- Alert -->
    <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" id="username" class="form-control"
                 placeholder="Enter username or email" required autocomplete="username" />
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter password" required autocomplete="current-password" />
          <button class="btn btn-outline-secondary" type="button" id="toggle-password"
                  aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-solar w-100 py-2 fw-semibold" id="login-btn">
        <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
        Sign In
      </button>
    </form>

    <hr class="my-4" />
    <p class="text-center text-muted small mb-0">
      Sunalyzer National Solar Monitoring Platform
    </p>
  </div>
</div>

<script src="/lib/bootstrap.bundle.min.js"></script>
<script src="/js/platform_api.js"></script>
<script>
  // If already logged in, redirect to platform (only if token in localStorage)
  const existing = localStorage.getItem("sunalyzer_token");
  if (existing) {
    PlatformAPI.auth.me().then(user => {
      if (user && user.role === "ADMIN") window.location.href = "/admin";
      else if (user) window.location.href = "/platform";
    }).catch(() => {
      // Token invalid/expired — clear it and stay on login page
      localStorage.removeItem("sunalyzer_token");
    });
  }

  // Toggle password visibility
  document.getElementById("toggle-password").addEventListener("click", () => {
    const pwd = document.getElementById("password");
    const icon = document.querySelector("#toggle-password i");
    if (pwd.type === "password") {
      pwd.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      pwd.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  });

  // Login form submit
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    PlatformAPI.hideError();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn      = document.getElementById("login-btn");
    const spinner  = document.getElementById("login-spinner");

    btn.disabled = true;
    spinner.classList.remove("d-none");

    try {
      const resp = await PlatformAPI.auth.login(username, password);
      // Save token to localStorage as fallback for cookie-blocked environments
      if (resp.access_token) {
        localStorage.setItem("sunalyzer_token", resp.access_token);
      }
      // Redirect based on role
      if (resp.user.role === "ADMIN") {
        window.location.href = "/admin";
      } else {
        window.location.href = "/platform";
      }
    } catch (err) {
      PlatformAPI.showError(err.data?.error || "Login failed. Check your credentials.");
    } finally {
      btn.disabled = false;
      spinner.classList.add("d-none");
    }
  });
</script>
</body>
</html>
