<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sunalyzer — Sign In</title>
  <link href="/lib/bootstrap.min.css" rel="stylesheet"/>
  <link href="/lib/fontawesome/css/all.min.css" rel="stylesheet"/>
  <link href="/css/platform.css" rel="stylesheet"/>
</head>
<body class="sz-auth-page">

<div class="sz-auth-card">

  <div class="sz-auth-logo">
    <div class="sz-auth-logo-icon"><i class="fas fa-sun"></i></div>
    <span class="sz-auth-logo-name">Sunalyzer</span>
  </div>

  <p class="sz-auth-tagline">Solar Fleet Management Platform</p>
  <h2 class="sz-auth-title">Sign in to your account</h2>

  <div id="alert-error" class="sz-alert sz-alert-err d-none" role="alert">
    <i class="fas fa-circle-exclamation"></i>
    <span id="alert-error-text"></span>
  </div>

  <form id="login-form" novalidate>
    <div class="sz-field">
      <label class="sz-label" for="username">Username or Email</label>
      <input type="text" id="username" class="sz-input"
             placeholder="Enter username or email"
             required autocomplete="username"/>
    </div>

    <div class="sz-field">
      <label class="sz-label" for="password">Password</label>
      <div style="position:relative">
        <input type="password" id="password" class="sz-input"
               placeholder="Enter password"
               required autocomplete="current-password"
               style="padding-right:38px"/>
        <button type="button" id="toggle-password" aria-label="Toggle password"
                style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;color:var(--c-text-muted);
                       font-size:13px;padding:0">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="sz-btn sz-btn-primary w-100 mt-2" id="login-btn"
            style="justify-content:center;padding:9px 14px;font-size:14px;font-weight:600">
      <span id="login-spinner" class="d-none" style="display:inline-block">
        <i class="fas fa-circle-notch fa-spin me-1"></i>
      </span>
      Sign In
    </button>
  </form>

  <p style="font-size:11px;color:var(--c-text-muted);text-align:center;margin-top:20px">
    Sunalyzer — National Solar Monitoring Platform
  </p>
</div>

<script src="/lib/bootstrap.bundle.min.js"></script>
<script src="/js/platform_api.js"></script>
<script>
  // Already logged in → redirect
  const existing = localStorage.getItem("sunalyzer_token");
  if (existing) {
    PlatformAPI.auth.me().then(u => {
      window.location.replace(u.role === "ADMIN" ? "/admin" : "/platform");
    }).catch(() => localStorage.removeItem("sunalyzer_token"));
  }

  document.getElementById("toggle-password").addEventListener("click", () => {
    const p = document.getElementById("password");
    const i = document.querySelector("#toggle-password i");
    p.type = p.type === "password" ? "text" : "password";
    i.className = p.type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
  });

  function showError(msg) {
    document.getElementById("alert-error-text").textContent = msg;
    document.getElementById("alert-error").classList.remove("d-none");
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("alert-error").classList.add("d-none");
    const btn = document.getElementById("login-btn");
    const sp  = document.getElementById("login-spinner");
    btn.disabled = true;
    sp.classList.remove("d-none");
    try {
      const r = await PlatformAPI.auth.login(
        document.getElementById("username").value.trim(),
        document.getElementById("password").value
      );
      window.location.replace(r.user.role === "ADMIN" ? "/admin" : "/platform");
    } catch (err) {
      showError(err.data?.error || "Invalid credentials. Please try again.");
    } finally {
      btn.disabled = false;
      sp.classList.add("d-none");
    }
  });
</script>
</body>
</html>
