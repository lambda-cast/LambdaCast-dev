name: lambdacastt

services:

  # ─── Main LambdaCast (Flask server + grabber) ──────────────────────────────
  lambdacast:
    container_name: lambdacastt
    image: lambdacastt:latest
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    ports:
      - "8020:5000"
    volumes:
      - ./data:/data
      - ./backend:/backend
      - ./site:/site
      - ./models:/models    # ML models for forecasting (persisted across restarts)
    env_file:
      - .env                # SUNALYZER_ADMIN_USER/EMAIL/PASSWORD, SUNALYZER_SECRET_KEY, TOKEN_LIFETIME_S
    depends_on:
      - isolarcloud-bridge

  # ─── iSolarCloud OAuth Bridge (FastAPI) ─────────────────────────────────────
  #
  # First-time setup (one-time, after docker compose up):
  #   1. docker compose logs -f isolarcloud-bridge
  #      → copy the OAuth URL that appears in the logs
  #   2. Open that URL in your browser, log into iSolarCloud, and authorize.
  #      The callback will redirect to http://<your-host>:8000/callback
  #   3. Token is saved to ./data/isolarcloud_token.json — subsequent restarts
  #      restore it automatically, no browser action needed.
  #
  # After authorization:
  #   4. Run the installation seed:
  #      docker compose --profile tools run --rm seed
  #
  isolarcloud-bridge:
    container_name: lambdacastt-bridge
    image: lambdacastt-bridge:latest
    build:
      context: .
      dockerfile: dockerfile.bridge
    restart: always
    ports:
      - "8000:8000"          # expose on host:8000 so you can open /callback from browser
    volumes:
      - ./data:/data         # token file persisted at ./data/isolarcloud_token.json
      - ./local_testing:/app
    env_file:
      - .env.isolarcloud     # ISOLARCLOUD_APP_KEY/SECRET_KEY/APP_ID, BRIDGE_REDIRECT_URI, TOKEN_FILE

  # ─── One-shot seed: create installation ──────────────────────────────────────
  #
  # Run once after the bridge is authenticated:
  #   docker compose --profile tools run --rm seed
  #
  seed:
    container_name: lambdacastt-seed
    image: lambdacastt-seed:latest
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./data:/data
    env_file:
      - .env                 # SUNALYZER_ADMIN_PASSWORD, SUNALYZER_SECRET_KEY
    environment:
      - ISOLARCLOUD_BRIDGE_URL=http://isolarcloud-bridge:8000
    entrypoint: ["python", "backend/create_fss_installation.py"]
    profiles:
      - tools             # only runs with: docker compose --profile tools run seed
    depends_on:
      - isolarcloud-bridge
